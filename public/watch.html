<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vexo | Video İzle</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="watch">
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar__left">
          <button class="menu-toggle" aria-label="Menüyü aç/kapat">☰</button>
          <a href="/" class="brand" aria-label="Vexo anasayfa">
            <span class="brand__mark">V</span>
            <span class="brand__text">Vexo</span>
          </a>
        </div>

        <form class="searchbar" action="/search.html" method="get">
          <input name="q" type="search" placeholder="Videolarda ara" aria-label="Arama" />
          <button type="submit">Ara</button>
        </form>

        <div id="auth-nav" class="header-actions"></div>
      </header>

      <main class="page-container content">
        <div class="watch-layout">
          <section class="watch-main">
            <div class="player-panel">
              <video id="video-player" class="video-player" controls playsinline preload="metadata"></video>
            </div>

            <div class="player-meta">
              <h1 id="player-title" class="player-title">Yükleniyor...</h1>
              <div class="meta-line" id="player-meta-line"></div>
              <div class="video-actions">
                <button type="button" id="like-button" class="action-btn">👍 Beğen</button>
                <button type="button" id="subscribe-button" class="secondary-btn">Abone ol</button>
              </div>
            </div>
          </section>

          <aside class="recommend-panel">
            <h3>Önerilen videolar</h3>
            <div id="recommendations" class="video-grid"></div>
          </aside>
        </div>

        <section class="info-panel" style="margin-top: 1.5rem;">
          <h3>Video açıklaması</h3>
          <div id="video-description" class="info-text"></div>
        </section>

        <section class="comment-panel" style="margin-top: 1.5rem;">
          <h3>Yorumlar</h3>
          <form id="comment-form" class="comment-form">
            <textarea id="comment-input" placeholder="Yorum yazın..." maxlength="500" required></textarea>
            <button type="submit" class="primary-btn">Yorum yap</button>
          </form>
          <ul id="comment-list" class="comment-list"></ul>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
