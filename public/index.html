<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vexo | Watch. Share. Create.</title>

    <meta
      name="description"
      content="Vexo özgün video paylaşım platformu."
    />

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body data-page="home">
    <div class="page-shell">

      <!-- =========================
           ÜST MENÜ
           ========================= -->
      <header class="topbar">

        <div class="topbar__left">

          <button
            class="menu-toggle"
            aria-label="Menüyü aç/kapat"
            type="button"
          >
            ☰
          </button>

          <!-- VEXO LOGO -->
          <a
            href="/"
            class="brand"
            aria-label="Vexo anasayfa"
          >

            <svg
              class="brand__logo"
              viewBox="0 0 48 48"
              aria-hidden="true"
            >
              <rect
                x="4"
                y="8"
                width="40"
                height="32"
                rx="11"
                fill="currentColor"
              />

              <path
                d="M20 17L34 24L20 31V17Z"
                fill="white"
              />
            </svg>

            <span class="brand__text">
              Vexo
            </span>

          </a>

        </div>


        <!-- =========================
             ARAMA
             ========================= -->
        <form
          class="searchbar"
          action="/search.html"
          method="get"
        >

          <input
            id="global-search-input"
            name="q"
            type="search"
            placeholder="Videolarda ara"
            aria-label="Arama"
          />

          <button type="submit">
            Ara
          </button>

        </form>


        <!-- =========================
             HESAP BUTONLARI
             ========================= -->
        <div
          id="auth-nav"
          class="header-actions"
        ></div>


        <!-- =========================
             TEMA
             ========================= -->
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Tema değiştir"
        >
          Açık
        </button>

      </header>


      <!-- =========================
           ANA LAYOUT
           ========================= -->
      <div class="layout">


        <!-- =========================
             SIDEBAR
             ========================= -->
        <aside
          class="sidebar"
          id="sidebar"
        >

          <nav class="sidebar__nav">


            <!-- ANA SAYFA -->
            <a
              href="/"
              class="nav-item active"
            >

              <span
                class="nav-icon"
                aria-hidden="true"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    d="M3 11.5L12 4l9 7.5"
                  />

                  <path
                    d="M5.5 10.5V20h13v-9.5"
                  />

                  <path
                    d="M9.5 20v-5h5v5"
                  />
                </svg>
              </span>

              Ana Sayfa

            </a>


            <!-- KEŞFET -->
            <a
              href="/search.html?q=keşfet"
              class="nav-item"
            >

              <span
                class="nav-icon nav-icon--explore"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >

                  <path
                    d="M13.5 10.5L20 4l-3.5 8.5L10 20l3.5-9.5Z"
                  />

                  <path
                    d="M4 4h.01"
                    stroke-width="3"
                    stroke-linecap="round"
                  />

                  <path
                    d="M20 20h.01"
                    stroke-width="3"
                    stroke-linecap="round"
                  />

                </svg>

              </span>

              Keşfet

            </a>


            <!-- ABONELİKLER -->
            <a
              href="#"
              class="nav-item"
            >

              <span
                class="nav-icon"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >

                  <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="3"
                  />

                  <path
                    d="M9 9l6 3-6 3V9Z"
                    fill="currentColor"
                    stroke="none"
                  />

                </svg>

              </span>

              Abonelikler

            </a>


            <!-- GEÇMİŞ -->
            <a
              href="#"
              class="nav-item"
            >

              <span
                class="nav-icon"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >

                  <circle
                    cx="12"
                    cy="12"
                    r="8.5"
                  />

                  <path
                    d="M12 7v5l3.5 2"
                  />

                </svg>

              </span>

              Geçmiş

            </a>


            <!-- BEĞENİLENLER -->
            <a
              href="#"
              class="nav-item"
            >

              <span
                class="nav-icon"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >

                  <path
                    d="M7 10v10H4V10h3Z"
                  />

                  <path
                    d="M7 19h10.5c1.1 0 2-.7 2.3-1.7l1-4c.4-1.5-.7-3-2.3-3H14l.8-3.1c.3-1.2-.4-2.4-1.6-2.8L12 4 8 10"
                  />

                </svg>

              </span>

              Beğenilen Videolar

            </a>


            <!-- VİDEO YÜKLE -->
            <a
              href="/upload.html"
              class="nav-item"
            >

              <span
                class="nav-icon"
                aria-hidden="true"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >

                  <rect
                    x="4"
                    y="4"
                    width="16"
                    height="16"
                    rx="3"
                  />

                  <path
                    d="M12 16V8"
                  />

                  <path
                    d="M9 11l3-3 3 3"
                  />

                </svg>

              </span>

              Video Yükle

            </a>

          </nav>

        </aside>


        <!-- =========================
             ANA İÇERİK
             ========================= -->
        <main class="content">


          <!-- HERO -->
          <section class="hero-strip">

            <div>

              <p class="eyebrow">
                Watch. Share. Create.
              </p>

              <h1>
                Yenilikçi içerikleri Vexo’da keşfet.
              </h1>

            </div>

          </section>


          <!-- VİDEOLAR -->
          <section class="video-section">

            <div class="section-heading">

              <h2>
                Önerilen videolar
              </h2>

            </div>

            <div
              id="video-grid"
              class="video-grid"
            ></div>

          </section>

        </main>

      </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="/app.js"></script>

  </body>
</html>
